apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: smoke-override-pdb
spec:
  bindings:
    - name: hive_version
      value: 3.1.3
  steps:
  - name: install postgresql
    try:
    - apply:
        file: ../../setup/postgres.yaml
    - assert:
        file: ../../setup/postgres-assert.yaml
  - name: install superset cluster
    try:
    - apply:
        file: superset.yaml
    - assert:
        file: superset-assert.yaml
  - name: test pdb
    try:
    - assert:
        resource:
            kind: PodDisruptionBudget
            apiVersion: policy/v1
            metadata:
              name: test-superset-node
              namespace: ($namespace)
            spec:
              maxUnavailable: 1
            status:
              expectedPods: 2
              currentHealthy: 2
              disruptionsAllowed: 1
  - name: test env overrides
    try:
      - script:
          env:
            - name: NAMESPACE
              value: ($namespace)
          content: |
            set -eu
            # Deployment Spec Test Data
            SUPERSET_NODE_ENV=$(
              kubectl -n "$NAMESPACE" get sts test-superset-node-default \
                -o go-template='{{range .spec.template.spec.containers}}{{if eq .name "node"}}{{range .env}}{{printf "%s=%s\n" .name .value}}{{end}}{{end}}{{end}}'
            )

            # Deployment Spec Test Assertions
            printf '%s\n' "$SUPERSET_NODE_ENV" | grep -Fqx 'COMMON_VAR=group-value'
            printf '%s\n' "$SUPERSET_NODE_ENV" | grep -Fqx 'GROUP_VAR=group-value'
            printf '%s\n' "$SUPERSET_NODE_ENV" | grep -Fqx 'ROLE_VAR=role-value'
  - name: test config overrides
    try:
      - script:
          env:
            - name: NAMESPACE
              value: ($namespace)
          content: |
            set -eu

            SUPERSET_CONFIG=$(
              kubectl -n "$NAMESPACE" get cm test-superset-node-default \
                -o go-template='{{index .data "superset_config.py"}}'
            )

            # The role-group header replaces the complete role-level header value,
            # while the unrelated role-level footer remains inherited.
            test "$(printf '%s\n' "$SUPERSET_CONFIG" | sed -n '1p')" = 'COMMON_HEADER_VAR = "group-value"'
            test "$(printf '%s\n' "$SUPERSET_CONFIG" | tail -n 1)" = 'ROLE_FOOTER_VAR = "role-value"'
            test "$(printf '%s\n' "$SUPERSET_CONFIG" | grep -Fxc 'COMMON_HEADER_VAR = "group-value"')" -eq 1
            test "$(printf '%s\n' "$SUPERSET_CONFIG" | grep -Fxc 'ROLE_FOOTER_VAR = "role-value"')" -eq 1
            ! printf '%s\n' "$SUPERSET_CONFIG" | grep -Fqx 'COMMON_HEADER_VAR = "role-value"'
            ! printf '%s\n' "$SUPERSET_CONFIG" | grep -Fqx 'ROLE_HEADER_VAR = "role-value"'

            # Ordinary entries are raw Python assignments. The role-group value
            # replaces the role value and is emitted exactly once.
            test "$(printf '%s\n' "$SUPERSET_CONFIG" | grep -Fxc 'KUBEDOOP_OVERRIDE_PRECEDENCE = "group-value"')" -eq 1
            ! printf '%s\n' "$SUPERSET_CONFIG" | grep -Fqx 'KUBEDOOP_OVERRIDE_PRECEDENCE = "role-value"'

            # The operator-generated defaults remain between the two user blocks and
            # the pseudo keys themselves are not emitted as Python assignments.
            test "$(printf '%s\n' "$SUPERSET_CONFIG" | grep -Fxc 'ROW_LIMIT = 10000')" -eq 1
            ! printf '%s\n' "$SUPERSET_CONFIG" | grep -Eq '^EXPERIMENTAL_FILE_(HEADER|FOOTER)[[:space:]]*='
