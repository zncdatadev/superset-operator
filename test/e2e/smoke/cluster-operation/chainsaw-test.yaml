apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: smoke-cluster-operation
spec:
  bindings:
    - name: cluster_stopped
      value: false
    - name: cluster_paused
      value: false
  steps:
  - name: install postgresql
    try:
    - apply:
        file: ../../setup/postgres.yaml
    - assert:
        file: ../../setup/postgres-assert.yaml
  - name: install superset cluster
    try:
    # install superset cluster, clusterOperation.stopped: false, clusterOperation.reconciliationPaused: false
    - apply:
        file: superset.yaml
    - assert:
        bindings:
          - name: available_replicas
            value: 1
        file: superset-assert.yaml
  - name: stop superset cluster
    try:
    - apply:
        bindings:
          - name: cluster_stopped
            value: true
        file: superset.yaml
    - assert:
        bindings:
          - name: available_replicas
            value: 0
        file: superset-assert.yaml
    # resume: clearing stopped scales pods back up
  - name: restart superset cluster
    try:
    - apply:
        file: superset.yaml
    - assert:
        bindings:
          - name: available_replicas
            value: 1
        file: superset-assert.yaml
    # pause freezes reconciliation: requesting stopped=true WHILE paused must have NO effect (a
    # paused operator does not touch resources). After giving the operator time to reconcile, the
    # cluster must still be running — if pause were ignored, the stop would apply and this fails.
  - name: pause freezes a requested stop
    try:
    - apply:
        bindings:
          - name: cluster_paused
            value: true
          - name: cluster_stopped
            value: true
        file: superset.yaml
    - sleep:
        duration: 20s
    - assert:
        bindings:
          - name: available_replicas
            value: 1
        file: superset-assert.yaml
    # unpause: the previously-frozen desired state (stopped=true) now takes effect -> scale to 0
  - name: unpause applies the pending stop
    try:
    - apply:
        bindings:
          - name: cluster_paused
            value: false
          - name: cluster_stopped
            value: true
        file: superset.yaml
    - assert:
        bindings:
          - name: available_replicas
            value: 0
        file: superset-assert.yaml
