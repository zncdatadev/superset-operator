apiVersion: v1
kind: Secret
metadata:
  name: upgrade-credentials
type: Opaque
stringData:
  adminUser.username: admin
  adminUser.password: admin
  adminUser.email: admin@example.com
  adminUser.firstname: Framework
  adminUser.lastname: Upgrade
  appSecretKey: framework-upgrade-test-only
  connections.sqlalchemyDatabaseUri: postgresql://superset:superset@upgrade-postgres:5432/superset
---
apiVersion: superset.kubedoop.dev/v1alpha1
kind: SupersetCluster
metadata:
  name: upgrade
spec:
  image:
    productVersion: __PRODUCT_VERSION__
    kubedoopVersion: __KUBEDOOP_VERSION__
  clusterConfig:
    listenerClass: external-unstable
    credentialsSecret: upgrade-credentials
  node:
    roleConfig:
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 1
    roleGroups:
      primary:
        replicas: 1
      secondary:
        replicas: 1
